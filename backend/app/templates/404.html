<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Steryl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

<body class="bg-gradient-to-br from-teal-50 to-cyan-50 min-h-screen flex items-center justify-center">

        <a href="/" class="inline-flex items-center bg-teal-600 text-white px-6 py-3 rounded-xl hover:bg-teal-700 transition-all">
