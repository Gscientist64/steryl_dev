<!-- app/templates/manufacturer/batch-registration.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Batch Registration - Steryl Health OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    * { font-family: 'Inter', sans-serif; }
    body { padding-bottom: 80px; }
    .form-input:focus { ring: 2px solid #0d968b; }
</style>
</head>
<body class="bg-gray-50">
<!-- Top Navigation -->
<nav class="bg-white shadow-sm sticky top-0 z-40">
    <div class="px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Batch Registration</h1>
            <p class="text-gray-500 text-sm">Register new production batches with QR codes</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-full bg-teal-100 flex items-center justify-center">
                    <span class="text-sm font-bold text-teal-600" id="user-initial">U</span>
                </div>
                <span class="text-sm font-medium text-gray-700 hidden md:block" id="user-name">Loading...</span>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="max-w-4xl mx-auto p-6">
    <!-- Registration Form -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
            <h2 class="font-bold text-gray-800">New Batch Registration</h2>
        </div>
        
        <form id="batch-form" class="p-6 space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Select Product SKU *</label>
                <select id="product_id" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                    <option value="">Select a product...</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Manufacturing Date *</label>
                    <input type="date" id="manufacturing_date" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Expiry Date *</label>
                    <input type="date" id="expiry_date" required class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Quantity (Units) *</label>
                <input type="number" id="quantity" required min="1" placeholder="Enter number of units" class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-teal-500">
            </div>

            <div class="bg-teal-50 rounded-lg p-4 border border-teal-200">
                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-teal-600">info</span>
                    <div class="text-sm text-teal-800">
                        <p class="font-semibold">QR Code Generation</p>
                        <p class="text-teal-700 mt-1">A unique QR code will be generated for this batch upon registration.</p>
                    </div>
                </div>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 px-6 py-3 bg-teal-600 text-white rounded-lg font-semibold hover:bg-teal-700 transition-all">
                    Register Batch & Generate QR
                </button>
                <button type="button" onclick="window.location.href='{{ url_for('main.manufacturer_batches') }}'" class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-50 transition-all">
                    View Batches
                </button>
            </div>
        </form>
    </div>

    <!-- Recent Batches -->
    <div class="mt-8">
        <h3 class="font-bold text-gray-800 mb-4">Recent Batches</h3>
        <div id="recent-batches" class="space-y-3">
            <div class="text-center py-8 text-gray-500">Loading recent batches...</div>
        </div>
    </div>
</main>

<!-- Bottom Navigation -->
{% include 'components/bottom_nav.html' %}

<script>
function formatDate(dateString) {
    if (!dateString) return 'N/A';
    return new Date(dateString).toLocaleDateString();
}

function loadProducts() {
    fetch('/api/manufacturer/skus')
        .then(response => response.json())
        .then(data => {
            if (data.success && data.data) {
                const select = document.getElementById('product_id');
                select.innerHTML = '<option value="">Select a product...</option>' + 
                    data.data.map(p => `<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');
            }
        });
}

function loadRecentBatches() {
    fetch('/api/manufacturer/batches')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('recent-batches');
            if (data.success && data.data && data.data.length > 0) {
                container.innerHTML = data.data.slice(0, 5).map(batch => `
                    <div class="bg-white rounded-lg p-4 border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-semibold text-gray-800">${batch.batch_number}</p>
                                <p class="text-sm text-gray-500">${batch.product_name || 'Product'}</p>
                            </div>
                            <span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-700">${batch.status}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-4 mt-3 text-sm">
                            <div><p class="text-gray-500">Quantity</p><p class="font-semibold">${batch.quantity} units</p></div>
                            <div><p class="text-gray-500">Mfg Date</p><p class="font-semibold">${formatDate(batch.manufacturing_date)}</p></div>
                            <div><p class="text-gray-500">Expiry Date</p><p class="font-semibold">${formatDate(batch.expiry_date)}</p></div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<div class="text-center py-8 text-gray-500">No batches registered yet</div>';
            }
        });
}

function loadUserProfile() {
    fetch('/api/user-profile')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('user-name').textContent = data.data.first_name + ' ' + data.data.last_name;
                document.getElementById('user-initial').textContent = data.data.first_name.charAt(0);
            }
        });
}

document.getElementById('batch-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.innerHTML = 'Registering...';
    submitBtn.disabled = true;
    
    const formData = {
        product_id: document.getElementById('product_id').value,
        manufacturing_date: document.getElementById('manufacturing_date').value,
        expiry_date: document.getElementById('expiry_date').value,
        quantity: parseInt(document.getElementById('quantity').value)
    };
    
    try {
        const response = await fetch('/api/manufacturer/batch/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        const data = await response.json();
        if (data.success) {
            alert('Batch registered successfully! QR code has been generated.');
            document.getElementById('batch-form').reset();
            loadRecentBatches();
        } else {
            alert('Error: ' + data.message);
        }
    } catch (error) {
        alert('Failed to register batch');
    } finally {
        submitBtn.innerHTML = 'Register Batch & Generate QR';
        submitBtn.disabled = false;
    }
});

loadUserProfile();
loadProducts();
loadRecentBatches();
</script>
</body>
</html>
